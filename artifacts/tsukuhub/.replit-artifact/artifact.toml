kind = "web"
previewPath = "/"
title = "TsukuHub"
version = "1.0.0"
id = "artifacts/tsukuhub"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18906

[services.development]
run = "pnpm --filter @workspace/tsukuhub run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tsukuhub", "run", "build" ]
publicDir = "artifacts/tsukuhub/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18906"
BASE_PATH = "/"
